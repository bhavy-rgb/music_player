name: Windows build and security
on:
  push:
    branches: [main, genspark_ai_developer]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test and package Windows x64
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1
      - name: Audit direct and transitive dependencies
        shell: pwsh
        run: |
          $report = dotnet list Resonance.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet audit failed.' }
          $report | Set-Content artifacts/dependency-audit.json
          $audit = $report | ConvertFrom-Json
          if (@($audit.logs | Where-Object { $_.level -eq 'error' }).Count) { throw 'Audit source failure.' }
          $packages = @($audit.projects.frameworks | ForEach-Object { $_.topLevelPackages; $_.transitivePackages })
          if (@($packages | Where-Object { $_.vulnerabilities }).Count) { throw 'Vulnerable NuGet dependencies found.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: artifacts/TestResults/*.trx
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-win-x64
          path: |
            artifacts/Resonance-win-x64.zip
            artifacts/Resonance-win-x64.zip.sha256
            artifacts/dependency-audit.json
          if-no-files-found: error
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.3
          mkdir -p .tools/gitleaks
          cd .tools/gitleaks
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSLO "$base/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${version}_checksums.txt"
          grep " gitleaks_${version}_linux_x64.tar.gz$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          cd ../..
          .tools/gitleaks/gitleaks git . --log-opts='--all' --redact
